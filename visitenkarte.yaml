apiVersion: apps/v1
kind: Deployment
metadata:
  name: meine-visitenkarte
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visitenkarte
  template:
    metadata:
      labels:
        app: visitenkarte
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: visitenkarte-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: visitenkarte
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080 # Fester Port für den lokalen Zugriff