apiVersion: apps/v1
kind: Deployment
metadata:
  name: meine-visitenkarte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visitenkarte
  template:
    metadata:
      labels:
        app: visitenkarte
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html  # Hier sucht Nginx standardmäßig nach Webseiten
      volumes:
      - name: html-volume
        configMap:
          name: visitenkarte-html
---
apiVersion: v1
kind: Service
metadata:
  name: visitenkarte-service
spec:
  type: NodePort
  selector:
    app: visitenkarte
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080